<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yasky Dashboard - Stratix Agency</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0a0a0a; color: #fff; min-height: 100vh; }
    .header { background: #111; border-bottom: 1px solid #222; padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; }
    .header h1 { font-size: 20px; font-weight: 600; }
    .header h1 span { color: #25D366; }
    .status-badge { padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: 500; }
    .status-online { background: #0d2818; color: #25D366; border: 1px solid #25D366; }
    .status-offline { background: #2d1215; color: #ff4444; border: 1px solid #ff4444; }
    .main { display: flex; height: calc(100vh - 60px); }
    .sidebar { width: 320px; border-right: 1px solid #222; overflow-y: auto; }
    .sidebar-header { padding: 16px; border-bottom: 1px solid #222; display: flex; justify-content: space-between; align-items: center; }
    .sidebar-header h2 { font-size: 16px; font-weight: 500; }
    .toggle-btn { padding: 8px 16px; border-radius: 8px; border: none; cursor: pointer; font-size: 13px; font-weight: 500; transition: all 0.2s; }
    .toggle-on { background: #25D366; color: #000; }
    .toggle-off { background: #ff4444; color: #fff; }
    .toggle-btn:hover { opacity: 0.8; }
    .contact-list { list-style: none; }
    .contact-item { padding: 14px 16px; border-bottom: 1px solid #1a1a1a; cursor: pointer; transition: background 0.15s; }
    .contact-item:hover { background: #151515; }
    .contact-item.active { background: #1a2a1a; border-left: 3px solid #25D366; }
    .contact-id { font-size: 13px; color: #888; font-family: monospace; }
    .contact-time { font-size: 11px; color: #555; margin-top: 4px; }
    .chat-area { flex: 1; display: flex; flex-direction: column; }
    .chat-header { padding: 16px; border-bottom: 1px solid #222; font-size: 14px; color: #888; }
    .chat-messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .msg { max-width: 70%; padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.4; }
    .msg-in { background: #1a1a1a; align-self: flex-start; border-bottom-left-radius: 4px; }
    .msg-out { background: #0d3320; align-self: flex-end; border-bottom-right-radius: 4px; color: #25D366; }
    .msg-time { font-size: 10px; color: #555; margin-top: 4px; }
    .empty { display: flex; align-items: center; justify-content: center; height: 100%; color: #444; font-size: 14px; }
    .stats { display: flex; gap: 16px; padding: 16px; border-bottom: 1px solid #222; }
    .stat { flex: 1; background: #111; border-radius: 8px; padding: 12px; text-align: center; }
    .stat-num { font-size: 24px; font-weight: 600; color: #25D366; }
    .stat-label { font-size: 11px; color: #666; margin-top: 4px; }
    @media (max-width: 768px) { .sidebar { width: 100%; } .chat-area { display: none; } }
  </style>
</head>
<body>
  <div class="header">
    <h1><span>Yasky</span> Dashboard</h1>
    <div id="statusBadge" class="status-badge status-offline">Offline</div>
  </div>
  <div class="main">
    <div class="sidebar">
      <div class="sidebar-header">
        <h2>Contacts</h2>
        <button id="toggleBtn" class="toggle-btn toggle-on" onclick="toggleBot()">ON</button>
      </div>
      <div class="stats">
        <div class="stat">
          <div class="stat-num" id="totalContacts">0</div>
          <div class="stat-label">Total Contacts</div>
        </div>
        <div class="stat">
          <div class="stat-num" id="todayMsgs">0</div>
          <div class="stat-label">Messages Today</div>
        </div>
      </div>
      <ul class="contact-list" id="contactList"></ul>
    </div>
    <div class="chat-area">
      <div class="chat-header" id="chatHeader">Select a conversation</div>
      <div class="chat-messages" id="chatMessages">
        <div class="empty">Select a contact to view conversation</div>
      </div>
    </div>
  </div>

  <script>
    let selectedContact = null;

    async function loadStatus() {
      const res = await fetch('/api/status');
      const data = await res.json();
      const badge = document.getElementById('statusBadge');
      const btn = document.getElementById('toggleBtn');
      
      if (data.online) {
        badge.className = 'status-badge status-online';
        badge.textContent = 'Online';
      } else {
        badge.className = 'status-badge status-offline';
        badge.textContent = 'Offline';
      }
      
      if (data.enabled) {
        btn.className = 'toggle-btn toggle-on';
        btn.textContent = 'ON';
      } else {
        btn.className = 'toggle-btn toggle-off';
        btn.textContent = 'OFF';
      }
    }

    async function toggleBot() {
      await fetch('/api/toggle', { method: 'POST' });
      loadStatus();
    }

    async function loadContacts() {
      const res = await fetch('/api/contacts');
      const contacts = await res.json();
      const list = document.getElementById('contactList');
      document.getElementById('totalContacts').textContent = contacts.length;
      
      let todayCount = 0;
      const today = new Date().toDateString();
      
      list.innerHTML = contacts.map(c => {
        const time = c.lastMessageTime ? new Date(c.lastMessageTime).toLocaleString() : 'No messages';
        if (c.lastMessageTime && new Date(c.lastMessageTime).toDateString() === today) {
          todayCount += c.messageCount || 0;
        }
        return `<li class="contact-item ${selectedContact === c.id ? 'active' : ''}" onclick="selectContact('${c.id}')">
          <div class="contact-id">${c.id}</div>
          <div class="contact-time">${c.messageCount || 0} messages · ${time}</div>
        </li>`;
      }).join('');
      
      document.getElementById('todayMsgs').textContent = todayCount;
    }

    async function selectContact(id) {
      selectedContact = id;
      document.getElementById('chatHeader').textContent = id;
      loadContacts();
      
      const res = await fetch(`/api/conversation/${id}`);
      const msgs = await res.json();
      const container = document.getElementById('chatMessages');
      
      if (!msgs.length) {
        container.innerHTML = '<div class="empty">No messages yet</div>';
        return;
      }
      
      container.innerHTML = msgs.map(m => `
        <div class="msg msg-in">${escapeHtml(m.from)}<div class="msg-time">${new Date(m.time).toLocaleTimeString()}</div></div>
        <div class="msg msg-out">${escapeHtml(m.reply)}<div class="msg-time">${new Date(m.time).toLocaleTimeString()}</div></div>
      `).join('');
      
      container.scrollTop = container.scrollHeight;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    loadStatus();
    loadContacts();
    setInterval(loadStatus, 5000);
    setInterval(loadContacts, 10000);
  </script>
</body>
</html>
